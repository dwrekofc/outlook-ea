[package]
name = "mea"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "mea"
path = "src/bin/mea.rs"

[dependencies]
libc = "=0.2.186"
anyhow = "=1.0.102"
chrono = { version = "=0.4.44", features = ["serde"] }
clap = { version = "=4.6.0", features = ["derive"] }
html2text = "=0.14.4"
libsql = { version = "=0.9.30", default-features = false, features = ["core", "remote", "tls", "replication", "sync"] }
mailparse = "=0.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "=0.8.23"
thiserror = "=2.0.18"

[dev-dependencies]
tempfile = "=3.27.0"
